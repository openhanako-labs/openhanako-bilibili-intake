<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>内容摄取</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F4F3F0;--card:#FCFBFA;--ink:#1E1D1C;--ink-2:#6C6965;--ink-3:#9E9B97;
  --accent:#4A7A8A;--accent-lt:rgba(74,122,138,.06);--accent-line:rgba(74,122,138,.2);
  --line:rgba(30,29,28,.06);--line-s:rgba(30,29,28,.12);
  --ok:#5A8F7A;--warn:#B0893C;--err:#A8554A;
  --ease:cubic-bezier(.16,1,.3,1);--dur:.15s;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter","Noto Sans SC","PingFang SC",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
html{font-size:16px}
body{font-family:var(--font-ui);font-size:13px;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased;height:100vh;overflow:hidden}
::selection{background:var(--accent-lt)}:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px;border-radius:4px}
.app{display:flex;flex-direction:column;height:100vh}

/* ── 顶栏 ── */
/* ⭐ 横幅带：原图 1200x673，46px 的 cover 会把它压成中间一条带，
   右侧文档被裁成黑白条纹。改用 1200x170 的横幅带 + 72px 高，
   520px 宽时显示 72.5px 高——几乎不裁，图标/光线/文档都在。 */
.banner{height:72px;flex-shrink:0;background:#14161b url("cover-band.jpg") center center / cover no-repeat;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;height:44px;flex-shrink:0;padding:0 16px;gap:10px;background:var(--card);border-bottom:1px solid var(--line)}
.top .logo{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;flex-shrink:0}
.top .logo .i{width:20px;height:20px;border-radius:5px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;line-height:1}
.top .dot{font-size:10px;padding:2px 7px;border-radius:20px;background:rgba(90,143,122,.1);color:var(--ok);font-weight:500;flex-shrink:0}
.top .dot.err{background:rgba(168,85,74,.1);color:var(--err)}
.top .top-actions{margin-left:auto;display:flex;gap:4px}
.top .top-actions button{padding:5px 10px;border:1px solid var(--line-s);border-radius:5px;background:transparent;color:var(--ink-2);font-size:11px;cursor:pointer;font-family:var(--font-ui);transition:all var(--dur);white-space:nowrap}
.top .top-actions button:hover{background:var(--accent-lt);color:var(--accent);border-color:var(--accent-line)}

/* ── 采集栏 ── */
.collect-bar{display:flex;gap:8px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0;align-items:center;flex-wrap:wrap}
.platform-select{display:flex;gap:3px;flex-shrink:0}
.platform-select button{padding:5px 9px;border:1px solid var(--line-s);border-radius:5px;background:transparent;color:var(--ink-3);font-size:11px;cursor:pointer;transition:all var(--dur);font-family:var(--font-ui);white-space:nowrap}
.platform-select button:hover{background:var(--accent-lt);color:var(--accent);border-color:var(--accent-line)}
.platform-select button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* 后端未实现的平台（douyin/kuaishou 是 stub）：降透明度 + hover 提示，
   避免用户点了跑 15 秒才发现失败。 */
.platform-select button.stub{opacity:.42}
.platform-select button.stub:hover{opacity:.8;background:var(--accent-lt);color:var(--accent);border-color:var(--accent-line)}
/* 部分平台（xhs/weibo/zhihu/tieba）：能拿元数据，评论功能未实现 */
.platform-select button.partial{opacity:.7}
.platform-select button.partial:hover{opacity:.95;background:var(--accent-lt);color:var(--accent);border-color:var(--accent-line)}
/* min-width 180 → 220：7 个平台按钮占掉约 250px，卡片宽 520px 时
   URL 框只剩 190px，placeholder「回车采集」被裁成「回车采」。 */
.url-input{flex:1;display:flex;gap:6px;min-width:220px}
.url-input input{flex:1;padding:7px 11px;border:1px solid var(--line-s);border-radius:5px;font-size:12px;color:var(--ink);background:var(--bg);outline:none;transition:border-color var(--dur);font-family:var(--font-ui)}
.url-input input:focus{border-color:var(--accent)}
.url-input input::placeholder{color:var(--ink-3)}
.url-input button{padding:7px 15px;border:none;border-radius:5px;background:var(--accent);color:#fff;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font-ui);transition:opacity var(--dur)}
.url-input button:hover{opacity:.88}
.url-input button:disabled{opacity:.5;cursor:not-allowed}
.status{font-size:11px;color:var(--ink-3);white-space:nowrap}
.status.ok{color:var(--ok)}.status.err{color:var(--err)}

/* ── 搜索栏 ── */
.search-bar{display:flex;gap:6px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0;align-items:center}
.search-bar input{flex:1;padding:6px 11px;border:1px solid var(--line-s);border-radius:5px;font-size:12px;color:var(--ink);background:var(--bg);outline:none;transition:border-color var(--dur);font-family:var(--font-ui)}
.search-bar input:focus{border-color:var(--accent)}
.search-bar input::placeholder{color:var(--ink-3)}
.search-bar button{padding:6px 13px;border:1px solid var(--accent);border-radius:5px;background:transparent;color:var(--accent);font-size:11px;font-weight:500;cursor:pointer;font-family:var(--font-ui);transition:all var(--dur)}
.search-bar button:hover{background:var(--accent);color:#fff}
.search-bar button:disabled{opacity:.5;cursor:not-allowed}

/* ── 标签 ── */
.tabs{display:flex;gap:0;padding:0 16px;border-bottom:1px solid var(--line);flex-shrink:0;background:var(--card)}
.tabs button{padding:9px 13px 8px;border:none;background:transparent;font-size:12px;font-weight:500;color:var(--ink-3);cursor:pointer;position:relative;transition:color var(--dur);font-family:var(--font-ui)}
.tabs button:hover{color:var(--ink-2)}.tabs button.on{color:var(--ink)}
.tabs button.on::after{content:'';position:absolute;bottom:0;left:13px;right:13px;height:2px;background:var(--accent);border-radius:1px 1px 0 0}
.tabs .bd{margin-left:4px;font-size:10px;color:var(--ink-3);font-weight:400;font-family:var(--font-mono)}

/* ── 内容 ── */
.cw{flex:1;display:flex;overflow:hidden}
.ct{flex:1;overflow-y:auto;padding:14px 16px 40px}
.ct::-webkit-scrollbar{width:4px}.ct::-webkit-scrollbar-thumb{background:transparent;border-radius:2px}.ct:hover::-webkit-scrollbar-thumb{background:var(--line-s)}
.tc{display:none}.tc.on{display:block}

/* ── 记录 ── */
.rec{background:var(--card);border:1px solid var(--line);border-radius:7px;margin-bottom:8px;padding:12px 13px;transition:border-color var(--dur),box-shadow var(--dur)}
.rec:hover{border-color:var(--accent-line);box-shadow:0 1px 6px rgba(74,122,138,.05)}
.rec-top{display:flex;gap:8px;align-items:flex-start}
.rec-title{flex:1;font-size:13px;font-weight:500;line-height:1.4;min-width:0}
.rec-del{flex-shrink:0;padding:2px 6px;border:none;border-radius:4px;background:transparent;color:var(--ink-3);font-size:11px;cursor:pointer;opacity:0;transition:all var(--dur)}
.rec:hover .rec-del{opacity:1}
.rec-del:hover{background:rgba(168,85,74,.1);color:var(--err)}
.rec-meta{display:flex;gap:9px;font-size:11px;color:var(--ink-3);margin-top:5px;flex-wrap:wrap;align-items:center}
.rec-plat{padding:1px 6px;border-radius:3px;background:#E8E0D8;color:var(--ink-2);font-weight:500;font-size:10px}
.rec-when{margin-left:auto}
.rec-summary{font-size:12px;color:var(--ink-2);margin-top:8px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.rec-summary.clamped{max-height:3.9em;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 58%,transparent);mask-image:linear-gradient(180deg,#000 58%,transparent)}
.rec-toggle{margin-top:4px;padding:2px 9px;border:1px solid var(--line-s);border-radius:4px;background:transparent;color:var(--ink-3);font-size:10.5px;cursor:pointer;font-family:var(--font-ui);transition:all .12s}
.rec-toggle:hover{border-color:var(--accent-line);color:var(--accent)}
.rec-nosummary{font-size:11px;color:var(--ink-3);margin-top:7px;font-style:italic}
.rec-tags{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.rec-tags .tag{padding:1px 6px;border-radius:3px;font-size:10px;background:var(--accent-lt);color:var(--accent)}
.rec-src{font-size:10px;color:var(--ink-3);margin-top:6px;font-family:var(--font-mono);word-break:break-all}

/* ── 空状态 ── */
.empty{padding:36px 20px;text-align:center;color:var(--ink-3)}
.empty .e-icon{font-size:26px;margin-bottom:10px;opacity:.4}
.empty .e-sub{font-size:11px;margin-top:5px;color:var(--ink-3);opacity:.7}

/* ── 采集结果 ── */
.cap-head{margin-bottom:10px}
.cap-title{font-size:15px;font-weight:600;line-height:1.4}
.cap-meta{display:flex;gap:10px;font-size:11px;color:var(--ink-3);margin-top:6px;flex-wrap:wrap}
.cap-stats{display:flex;gap:12px;font-size:11px;color:var(--ink-2);margin-bottom:12px;padding:7px 11px;background:var(--card);border:1px solid var(--line);border-radius:5px}
.cap-transcript{font-size:12px;color:var(--ink-2);line-height:1.7;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:11px 13px;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto}
.cap-transcript::-webkit-scrollbar{width:4px}.cap-transcript::-webkit-scrollbar-thumb{background:var(--line-s);border-radius:2px}
.cap-note{font-size:10.5px;color:var(--ink-3);margin-top:10px;line-height:1.5;padding:8px 11px;border-left:2px solid var(--accent-line);background:var(--accent-lt);border-radius:0 4px 4px 0}
/* Whisper 兜底转写的警告提示：颜色用琥珀，和 cap-note 的青色区分 */
.cap-warn{font-size:10.5px;color:#8a6420;margin-top:8px;line-height:1.5;padding:8px 11px;border-left:2px solid #d4a24c;background:#fdf6e8;border-radius:0 4px 4px 0}
/* v0.6.27：音频已下载但 Whisper 转写失败 → 红色提示，内容截断 120 字符
   与 cap-note / cap-warn 同宽同字号，只有颜色区分 */
.cap-err{font-size:10.5px;color:var(--err);margin-top:8px;line-height:1.5;padding:8px 11px;border-left:2px solid var(--err);background:rgba(168,85,74,.08);border-radius:0 4px 4px 0;white-space:pre-wrap;word-break:break-all}

/* ── 搜索结果 ── */
.srow{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:7px;transition:border-color var(--dur)}
.srow:hover{border-color:var(--accent-line)}
.sinfo{flex:1;min-width:0}
.stitle{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.smeta{font-size:10.5px;color:var(--ink-3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-family:var(--font-mono);font-size:10px;padding:1px 5px;border-radius:3px;background:var(--accent-lt);color:var(--accent)}
.sbtn{flex-shrink:0;padding:5px 12px;border:1px solid var(--accent);border-radius:5px;background:transparent;color:var(--accent);font-size:11px;cursor:pointer;font-family:var(--font-ui);transition:all var(--dur)}
.sbtn:hover{background:var(--accent);color:#fff}

/* ── 状态 ── */
.st-block{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:12px 13px;margin-bottom:9px}
.st-head{font-size:12px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.st-head .dot{font-size:9px;padding:1px 6px}
.st-sub{font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.st-line{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:11.5px;border-bottom:1px solid var(--line)}
.st-line:last-child{border-bottom:none}
.st-k{color:var(--ink-3);flex-shrink:0}
.st-v{color:var(--ink);text-align:right;word-break:break-all;font-family:var(--font-mono);font-size:11px}
.st-v.warn{color:var(--warn)}
.st-cached{font-family:var(--font-mono);font-size:10px;font-weight:400;color:var(--ink-3);margin-left:6px}
.pv{font-family:var(--font-mono);font-size:10.5px;padding:1px 7px;border-radius:3px}
.pv.ok{background:rgba(90,143,122,.12);color:var(--ok)}
.pv.idle{background:rgba(30,29,28,.05);color:var(--ink-3)}
/* ⭐ 历史 tab */
.hist-list{display:flex;flex-direction:column;gap:8px;padding:4px 0}
.hist-item{padding:10px 12px;border:1px solid var(--line-s);border-radius:6px;background:var(--card)}
.hist-title{font-size:13px;font-weight:500;line-height:1.4;margin-bottom:6px}
.hist-meta{display:flex;gap:10px;font-size:10.5px;color:var(--ink-3);flex-wrap:wrap}
/* ⭐ 日志 tab */
.log-list{display:flex;flex-direction:column;gap:2px;font-family:var(--font-mono);font-size:11px;line-height:1.6}
.log-line{display:flex;gap:10px;padding:2px 0;border-bottom:1px solid var(--line-s)}
.log-line:last-child{border-bottom:none}
.log-time{color:var(--ink-3);flex-shrink:0}
.log-msg{color:var(--ink);word-break:break-all}
</style></head><body>
<div class="app">

  <div class="banner"></div>

  <div class="top">
    <div class="logo"><div class="i">↧</div>内容摄取</div>
    <span class="dot" id="auth-dot">…</span>
    <div class="top-actions">
      <button id="btn-new-rec" title="手动新增一条记录">+ 记录</button>
      <button id="btn-refresh">刷新</button>
    </div>
  </div>

  <div class="collect-bar">
    <div class="platform-select">
      <button class="on" data-p="bilibili">B站</button>
      <button data-p="xhs">小红书</button>
      <button data-p="weibo">微博</button>
      <button data-p="zhihu">知乎</button>
      <button data-p="tieba">贴吧</button>
      <button data-p="douyin">抖音</button>
      <button data-p="kuaishou">快手</button>
    </div>
    <div class="url-input">
      <input id="url-input" placeholder="粘贴链接或 BV 号，回车采集" autocomplete="off">
      <button id="btn-capture">采集</button>
    </div>
    <span class="status" id="capture-status"></span>
  </div>

  <div class="search-bar">
    <input id="search-input" placeholder="关键词搜索…" autocomplete="off">
    <button id="btn-search">搜索</button>
    <span class="status" id="search-status"></span>
  </div>

  <div class="tabs">
    <button class="on" data-tab="records">记录<span class="bd" id="rec-count">0</span></button>
    <button data-tab="capture">采集</button>
    <button data-tab="search">搜索</button>
    <button data-tab="history">历史</button>
    <button data-tab="logs">日志</button>
    <button data-tab="status">状态</button>
  </div>

  <div class="cw"><div class="ct">
    <div class="tc on" id="tc-records"><div class="status" id="rec-status"></div><div id="records-list"></div></div>
    <div class="tc" id="tc-capture"><div class="empty"><div class="e-icon">↧</div><div>采集内容后会显示在这里</div><div class="e-sub">链接填上方输入框，支持 BV 号</div></div></div>
    <div class="tc" id="tc-search"><div class="empty"><div class="e-icon">⌕</div><div>搜索结果会显示在这里</div></div></div>
    <div class="tc" id="tc-history"><div class="empty"><div class="e-icon">◌</div><div>点击「历史」加载采集记录</div></div></div>
    <div class="tc" id="tc-logs"><div class="empty"><div class="e-icon">⋮</div><div>点击「日志」加载运行日志</div></div></div>
    <div class="tc" id="tc-status"><div class="empty"><div class="e-icon">⚙</div><div>点击"状态"加载</div></div></div>
  </div></div>

</div>
<script src="intake-script.js"></script>
</body></html>
